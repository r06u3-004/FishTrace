[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishtrace-engine"
version = "0.1.0"
description = "Independent email forensics and phishing intelligence engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "dnspython>=2.6,<3",
  "dkimpy>=1.1,<2",
  "httpx>=0.27,<1",
  "python-magic>=0.4.27,<1",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fishtrace_engine*"]

[tool.setuptools.package-data]
fishtrace_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
