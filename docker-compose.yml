services:
  postgres:
    image: postgres:17
    container_name: fishtrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fishtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fishtrace}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishtrace} -d ${POSTGRES_DB:-fishtrace}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
