[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishtrace-cli"
version = "0.1.0"
description = "FishTrace command-line interface"
requires-python = ">=3.13,<3.14"
dependencies = [
  "typer>=0.12,<1",
  "fishtrace-engine>=0.1.0",
]

[project.scripts]
fishtrace = "fishtrace_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fishtrace_cli*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
